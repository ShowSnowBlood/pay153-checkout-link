services:
  pay153:
    build:
      context: .
    container_name: pay153-checkout-link
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PAY153_BILLING_ADDRESS_CACHE: /app/data/billing_addresses.json
      PAY153_LOG_DIR: /app/logs
      PAY153_WORKERS: ${PAY153_WORKERS:-20}
      PAY153_GLOBAL_RPM: ${PAY153_GLOBAL_RPM:-20}
      PAY153_IP_RPM: ${PAY153_IP_RPM:-3}
      PAY153_PROXY_PROBE_COUNT: ${PAY153_PROXY_PROBE_COUNT:-6}
      PAY153_PROXY_PROBE_TIMEOUT: ${PAY153_PROXY_PROBE_TIMEOUT:-8}
      PAY153_PROXY_PROBE_TTL: ${PAY153_PROXY_PROBE_TTL:-300}
      PAY153_PROXY_LEASE_FILE: /app/data/proxy_leases.json
      PAY153_PROXY_LEASE_MINUTES: ${PAY153_PROXY_LEASE_MINUTES:-120}
      PAY153_PROXY_GATEWAY: ${PAY153_PROXY_GATEWAY:-}
      PAY153_KAKAO_WORKER_TIMEOUT: ${PAY153_KAKAO_WORKER_TIMEOUT:-180}
    ports:
      - "${PAY153_PORT:-18096}:18096"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
